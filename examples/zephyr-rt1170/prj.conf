# Zephyr project configuration for the Tier 2 picture-less Qt smoke test
# on MIMXRT1170-EVKB.  Stage 2 of the Qt-on-Zephyr two-stage build.

# C++ support.  GLIBCXX_LIBCPP pulls in the full libstdc++ from the
# Zephyr SDK toolchain (rather than Zephyr's MINIMAL_LIBCPP shim) so
# RTTI/exceptions work and Qt's std::unique_ptr / std::optional etc.
# link properly against the Stage 1 archives.
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_CPP_EXCEPTIONS=y
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_CPP_RTTI=y

# Force newlib.  RT1170-EVKB defaults to picolibc, but Stage 1's
# libQt6Core.a was compiled against newlib's <unistd.h>, <stdio.h>,
# <dirent.h> shim, etc.  Mixing libcs at link is undefined.
CONFIG_PICOLIBC=n
CONFIG_NEWLIB_LIBC=y

# POSIX subset for Qt's clock_gettime / pthread typedefs (Qt threading
# is disabled in Stage 1, but a couple of TUs still typedef-reach for
# pthread_t).
CONFIG_POSIX_API=y

# Hard-float FPU.  RT1170 Cortex-M7 has a double-precision FPU; Stage 1
# was cross-built with -mfpu=fpv5-d16 -mfloat-abi=hard, so Stage 2 MUST
# link against the +dp/hard multilib variant of the toolchain runtime.
# Without CONFIG_FPU=y the Zephyr build defaults to nofp multilib and
# the link fails on _GLOBAL_OFFSET_TABLE_ relocations.
CONFIG_FPU=y

# Console output via printk()
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y

# Memory: Qt6Core's static archives include QHash / QString machinery
# that wants real malloc().  4 MB heap + a comfortable main stack.
CONFIG_HEAP_MEM_POOL_SIZE=4194304
CONFIG_MAIN_STACK_SIZE=16384

# Make sure libc has the heap.
CONFIG_NEWLIB_LIBC_ALIGNED_HEAP_SIZE=4194304
