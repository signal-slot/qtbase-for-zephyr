# Tier 3 GUI prj.conf -- adds display + input subsystems on top of the
# picture-less Tier 2 baseline.

# C++ baseline (matches Tier 2).
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_CPP_EXCEPTIONS=y
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_CPP_RTTI=y

# Force newlib for ABI parity with Stage 1.
CONFIG_PICOLIBC=n
CONFIG_NEWLIB_LIBC=y

CONFIG_POSIX_API=y

# Hard-float -- Stage 1 was built with -mfpu=fpv5-d16 -mfloat-abi=hard.
CONFIG_FPU=y

# Console.
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y

# Display subsystem (RK055HDMIPI4MA0 shield activated via
# -DSHIELD=rk055hdmipi4ma0 on the west build line).
CONFIG_DISPLAY=y

# Input subsystem -- needed by the shield's GT911 touch driver (Tier 4
# will hook it into QWindowSystemInterface).
CONFIG_INPUT=y

# Tier 3.5: PXP (Pixel Processing Pipeline) double-buffered DMA path.
# Without this, display_write() pushes pixels straight into the LCDIF
# scan-out framebuffer while the panel is reading from it -> visible
# tearing.  With PXP enabled the LCDIF driver internally double-buffers
# and swaps on vsync, which is what Slint's printerdemo relies on.
# Forces full-frame writes (partial updates are not supported in this
# mode); qzephyr_display_write() already always sends the bounding rect
# of the dirty region so this works out.
CONFIG_DMA=y
CONFIG_MCUX_ELCDIF_PXP=y
# Hardware rotation done during the PXP DMA so we get landscape on the
# physically-mounted-rotated RK055 without any Qt-side transform.
CONFIG_MCUX_ELCDIF_PXP_ROTATE_90=y

# Bigger heap + main stack for QtGui paint paths.  720x1280 RGB16 frame
# buffer alone is ~1.84 MB.
CONFIG_HEAP_MEM_POOL_SIZE=8388608
CONFIG_NEWLIB_LIBC_ALIGNED_HEAP_SIZE=8388608
# QPainter::drawText with FreeType pushes a lot of stack; 32K caused
# an MPU "Stacking error" fault in this app.  64K is comfortable.
CONFIG_MAIN_STACK_SIZE=65536
