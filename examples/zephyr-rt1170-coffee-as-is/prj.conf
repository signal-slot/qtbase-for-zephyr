# Board-side Kconfig for the unmodified Qt 6.11 Coffee demo on
# RT1170-EVKB.  All Qt-application-level knobs are turned on via
# CONFIG_QT*; the qt-zephyr-port module's zephyr/CMakeLists.txt picks
# those up and pulls in the right glue files / static archives /
# QML plugins.

# Activate the Qt module.
CONFIG_QT=y
CONFIG_QT_GUI=y
CONFIG_QT_QML=y
CONFIG_QT_QUICK_CONTROLS=y
CONFIG_QT_SVG=y
CONFIG_QT_EMBEDDED_ROBOTO_FONT=y

# Standard C++/POSIX baseline matching Stage 1 ABI.
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_CPP_EXCEPTIONS=y
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_CPP_RTTI=y
CONFIG_PICOLIBC=n
CONFIG_NEWLIB_LIBC=y
CONFIG_POSIX_API=y
CONFIG_FPU=y

# Console.
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y

# Display + GT911 touch from rk055hdmipi4ma0 shield.
CONFIG_DISPLAY=y
CONFIG_INPUT=y
CONFIG_INPUT_THREAD_STACK_SIZE=32768

# Tier 3.5: PXP double-buffered DMA + hardware 90-degree rotation.
CONFIG_DMA=y
CONFIG_MCUX_ELCDIF_PXP=y
CONFIG_MCUX_ELCDIF_PXP_ROTATE_90=y

# Memory sized for QtQuick + V4 + SVG renderer + scene-graph + 1280x720
# RGB16 framebuffer.
CONFIG_HEAP_MEM_POOL_SIZE=16777216
CONFIG_NEWLIB_LIBC_ALIGNED_HEAP_SIZE=16777216

# Stage 2 needs a bigger main stack for V4 + QPainter + FreeType.
CONFIG_MAIN_STACK_SIZE=524288

# Stage 2 also needs a bigger ISR + idle stack -- otherwise C++ static
# initializers of the demo's QML plugin overflow the default 2 KB
# region and trip the MPU guard during boot.
CONFIG_ISR_STACK_SIZE=8192
CONFIG_IDLE_STACK_SIZE=4096
