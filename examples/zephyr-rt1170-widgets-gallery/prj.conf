# Tier 6 prj.conf -- Qt official Widgets Gallery.  Same baseline as the
# Tier 3 GUI example, with bumped heap and stack because the gallery
# instantiates a deeper widget tree (QDialog + several QGroupBox +
# QTabWidget + QToolBox + QProgressBar + QTextBrowser + a
# QStandardItemModel-backed QListView / QTableView / QTreeView).

# C++ baseline (matches Stage 1 ABI).
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_CPP_EXCEPTIONS=y
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_CPP_RTTI=y

# Force newlib for ABI parity with Stage 1.
CONFIG_PICOLIBC=n
CONFIG_NEWLIB_LIBC=y

CONFIG_POSIX_API=y

# Hard-float -- Stage 1 was built with -mfpu=fpv5-d16 -mfloat-abi=hard.
CONFIG_FPU=y

# Console.
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y

# Display subsystem (RK055HDMIPI4MA0 shield activated via
# -DSHIELD=rk055hdmipi4ma0 on the west build line).
CONFIG_DISPLAY=y

# Input subsystem -- GT911 touch driver from the shield.
CONFIG_INPUT=y

# Zephyr's input subsystem runs registered callbacks on a dedicated
# thread (CONFIG_INPUT_MODE_THREAD).  Default stack is 1 KB, which is
# fine for trivial input handlers but not for ours: even with Qt's
# AsynchronousDelivery the call still threads through a fair bit of
# Qt-internal code (the threading detection that would route to the
# main thread is broken on this static build, so notify() ends up
# inlined).  QApplication::notify reserves ~4.5 KB of stack frame on
# entry alone -- give the input thread enough headroom for a full
# QWidget event delivery.
CONFIG_INPUT_THREAD_STACK_SIZE=32768

# Tier 3.5: PXP double-buffered DMA + hardware 90-degree rotation for
# landscape on the physically-rotated RK055.
CONFIG_DMA=y
CONFIG_MCUX_ELCDIF_PXP=y
CONFIG_MCUX_ELCDIF_PXP_ROTATE_90=y

# Larger heap than the Tier 3 demo: WidgetGallery brings in the full
# QtWidgets style machinery + multiple model/view widgets.  12 MB
# leaves headroom on top of the ~1.84 MB RGB16 framebuffer.
CONFIG_HEAP_MEM_POOL_SIZE=12582912
CONFIG_NEWLIB_LIBC_ALIGNED_HEAP_SIZE=12582912

# Widget painting recurses deeper than the Tier 3 demo (style ->
# QPainter -> FreeType).  96K is comfortable; 64K may trigger MPU
# stacking faults during initial show().
CONFIG_MAIN_STACK_SIZE=98304
