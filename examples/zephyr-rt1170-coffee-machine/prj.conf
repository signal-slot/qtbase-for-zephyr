# Tier 8 prj.conf -- Qt official Coffee Machine demo.  QtQuick +
# Quick Controls 2 + SVG.  Memory pressure is much higher than the
# Tier 6 widgets gallery: the V4 engine + QML cache + scene-graph
# items + SVG renderer all live in the same heap.

# C++ baseline (matches Stage 1 ABI).
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_CPP_EXCEPTIONS=y
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_CPP_RTTI=y

# Force newlib for ABI parity with Stage 1.
CONFIG_PICOLIBC=n
CONFIG_NEWLIB_LIBC=y

CONFIG_POSIX_API=y

# Hard-float -- Stage 1 was built with -mfpu=fpv5-d16 -mfloat-abi=hard.
CONFIG_FPU=y

# Console.
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y

# Display subsystem (RK055HDMIPI4MA0 shield activated via
# -DSHIELD=rk055hdmipi4ma0 on the west build line).
CONFIG_DISPLAY=y

# Input subsystem -- GT911 touch driver from the shield.
CONFIG_INPUT=y
CONFIG_INPUT_THREAD_STACK_SIZE=32768

# Zephyr's interrupt stack + idle thread stack default to 2 KB / ~320 B,
# tiny by Qt standards.  Static C++ constructors of demos_coffeePlugin
# end up on one of them during boot, overflowing into the next stack
# region and tripping the MPU guard immediately on first ISR entry.
CONFIG_ISR_STACK_SIZE=8192
CONFIG_IDLE_STACK_SIZE=4096



# Tier 3.5: PXP double-buffered DMA + hardware 90-degree rotation for
# landscape on the physically-rotated RK055.
CONFIG_DMA=y
CONFIG_MCUX_ELCDIF_PXP=y
CONFIG_MCUX_ELCDIF_PXP_ROTATE_90=y

# QtQuick + V4 JS engine + scenegraph + SVG decode all live in heap.
# 32 MB leaves headroom on top of the ~1.84 MB RGB16 framebuffer.
CONFIG_HEAP_MEM_POOL_SIZE=16777216
CONFIG_NEWLIB_LIBC_ALIGNED_HEAP_SIZE=16777216

# QtQuick's render path recurses through QPainter -> FreeType +
# SVG renderer; bump the main stack.
CONFIG_MAIN_STACK_SIZE=524288
