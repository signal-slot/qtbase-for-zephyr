#
# Base qmake configuration for GCC on Zephyr RTOS
#

MAKEFILE_GENERATOR      = UNIX

QMAKE_PLATFORM          = zephyr

include(unix.conf)
include(gcc-base-unix.conf)
include(g++-unix.conf)

# Zephyr specific settings
QMAKE_CFLAGS_THREAD     = 
QMAKE_CXXFLAGS_THREAD   = 
QMAKE_LFLAGS_THREAD     = 

# Zephyr uses its own build system and SDK
zephyr_sdk_install_dir = $$(ZEPHYR_SDK_INSTALL_DIR)
isEmpty(zephyr_sdk_install_dir) {
    error("This qmakespec requires ZEPHYR_SDK_INSTALL_DIR to be set")
}

zephyr_base = $$(ZEPHYR_BASE)
isEmpty(zephyr_base) {
    error("This qmakespec requires ZEPHYR_BASE to be set")
}

# Compiler configuration
QMAKE_CC                = arm-zephyr-eabi-gcc
QMAKE_CXX               = arm-zephyr-eabi-g++
QMAKE_LINK              = $$QMAKE_CXX
QMAKE_LINK_C            = $$QMAKE_CC
QMAKE_AR                = arm-zephyr-eabi-ar cqs
QMAKE_OBJCOPY           = arm-zephyr-eabi-objcopy
QMAKE_NM                = arm-zephyr-eabi-nm -P
QMAKE_RANLIB            = arm-zephyr-eabi-ranlib
QMAKE_STRIP             = arm-zephyr-eabi-strip

# Zephyr specific flags
QMAKE_CFLAGS_OPTIMIZE_FULL  = -O2
QMAKE_CFLAGS_OPTIMIZE_DEBUG = -Og -g
QMAKE_CFLAGS_OPTIMIZE_SIZE  = -Os

QMAKE_CFLAGS_DEBUG      = $$QMAKE_CFLAGS_OPTIMIZE_DEBUG
QMAKE_CFLAGS_SHLIB      = 
QMAKE_CFLAGS_STATIC_LIB = 
QMAKE_CFLAGS_APP        = 
QMAKE_CFLAGS_YACC       = 
QMAKE_CFLAGS_PIC        = 

# Disable features not supported by Zephyr
QMAKE_CFLAGS           += -fno-common -fno-exceptions
QMAKE_CXXFLAGS         += -fno-common -fno-exceptions -fno-rtti

# Linker flags
QMAKE_LFLAGS_GCSECTIONS = -Wl,--gc-sections
QMAKE_LFLAGS            = $$QMAKE_LFLAGS_GCSECTIONS
QMAKE_LFLAGS_SHLIB      = 
QMAKE_LFLAGS_PLUGIN     = 
QMAKE_LFLAGS_SONAME     = 
QMAKE_LFLAGS_THREAD     = 
QMAKE_LFLAGS_RPATH      = 

# Zephyr doesn't support shared libraries
QMAKE_LINK_SHLIB        = 
QMAKE_LINK_C_SHLIB      = 

# File extensions
QMAKE_EXTENSION_SHLIB   = 
QMAKE_PREFIX_SHLIB      = 

load(qt_config)