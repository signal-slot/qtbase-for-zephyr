#
# qmake configuration for Zephyr RTOS ARM systems
#

include(../common/zephyr-base.conf)

# ARM specific flags
QMAKE_CFLAGS_RELEASE    = -Os -march=armv7-m -mthumb
QMAKE_CFLAGS_RELEASE_WITH_DEBUGINFO = -Os -g -march=armv7-m -mthumb

QMAKE_CXXFLAGS_RELEASE  = $$QMAKE_CFLAGS_RELEASE
QMAKE_CXXFLAGS_RELEASE_WITH_DEBUGINFO = $$QMAKE_CFLAGS_RELEASE_WITH_DEBUGINFO

load(qt_config)