# Stage 1 mkspec for Qt 6 cross-build targeting Zephyr on AArch64
# (Cortex-A53: TI AM62P / Toradex Verdin AM62P, and similar).
#
# The AArch64 sibling of zephyr-arm-cm7-g++.  Same Stage 1 model: Qt is
# built standalone as static archives with the Zephyr SDK toolchain and
# no Zephyr build context; the Zephyr-aware Qt code (corelib event
# dispatcher, qzephyr platform plugin) is compiled inside `west build`
# (Stage 2).  Differences from the Cortex-M7 spec: the Zephyr SDK's
# aarch64-zephyr-elf toolchain ships picolibc (not newlib), the core has
# an MMU and native 64-bit atomics, and enums are int-sized by default.

include(../common/zephyr-base.conf)

QMAKE_CFLAGS_RELEASE    = -O2 -mcpu=cortex-a53 -mabi=lp64
QMAKE_CFLAGS_RELEASE_WITH_DEBUGINFO = $$QMAKE_CFLAGS_RELEASE -g

QMAKE_CXXFLAGS_RELEASE  = $$QMAKE_CFLAGS_RELEASE
QMAKE_CXXFLAGS_RELEASE_WITH_DEBUGINFO = $$QMAKE_CFLAGS_RELEASE_WITH_DEBUGINFO

load(qt_config)
