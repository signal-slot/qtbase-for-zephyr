# Stage 1 mkspec for Qt 6 cross-build targeting Zephyr on Cortex-M7
# (NXP iMX RT1170 + similar).
#
# Distinct from the older zephyr-arm-gnueabi-g++ mkspec, which assumes
# the Zephyr CMake build context is available (its qplatformdefs.h pulls
# in <zephyr/kernel.h> + <zephyr/posix/*>).  This mkspec is for the
# Stage 1 host-driven cross-configure where Qt is built standalone as
# static archives, without any Zephyr build context.  All Zephyr-aware
# Qt code paths (corelib event dispatcher, qzephyr platform plugin)
# are deferred to Stage 2 (compiled inside `west build`).

include(../common/zephyr-base.conf)

QMAKE_CFLAGS_RELEASE    = -Os -mcpu=cortex-m7 -mfpu=fpv5-d16 -mfloat-abi=hard -mthumb
QMAKE_CFLAGS_RELEASE_WITH_DEBUGINFO = $$QMAKE_CFLAGS_RELEASE -g

QMAKE_CXXFLAGS_RELEASE  = $$QMAKE_CFLAGS_RELEASE
QMAKE_CXXFLAGS_RELEASE_WITH_DEBUGINFO = $$QMAKE_CFLAGS_RELEASE_WITH_DEBUGINFO

load(qt_config)
